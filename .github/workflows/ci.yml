name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # The Next.js app is nested one level down — see AGENTS.md.
    working-directory: internal

jobs:
  check:
    name: typecheck · lint · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in internal/package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: internal/pnpm-lock.yaml

      # postinstall runs `prisma generate`, which needs no database.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Reported, not enforced, until the pre-existing lint backlog in
      # app/legacy and components/ is cleared. Flip this off once `pnpm lint`
      # is clean on main.
      - run: pnpm lint
        continue-on-error: true

      - run: pnpm smoke
